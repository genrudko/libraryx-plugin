name: Build GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Require release notes
        shell: bash
        run: |
          notes="releases/${{ steps.tag.outputs.tag }}.md"
          test -s "$notes" || {
            echo "::error::Missing required release notes: $notes"
            exit 1
          }

      - name: Run checks
        shell: bash
        run: ./tools/check.sh

      - name: Build and verify ZIP
        shell: bash
        run: |
          ./tools/package.sh
          tag="${{ steps.tag.outputs.tag }}"
          cp dist/libraryx-debug.koplugin.zip "dist/libraryx-${tag}.koplugin.zip"
          sha256sum "dist/libraryx-${tag}.koplugin.zip" > "dist/libraryx-${tag}.koplugin.zip.sha256"
          unzip -t "dist/libraryx-${tag}.koplugin.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          title="LibraryX ${tag#v}"
          args=(release create "$tag" --title "$title" --notes-file "releases/${tag}.md")
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh "${args[@]}"
          fi

      - name: Attach ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release upload "$tag"             "dist/libraryx-${tag}.koplugin.zip"             "dist/libraryx-${tag}.koplugin.zip.sha256"             --clobber
