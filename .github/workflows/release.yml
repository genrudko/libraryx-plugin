name: Build release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build plugin ZIP
        shell: bash
        run: |
          ./tools/package.sh
          tag="${{ steps.tag.outputs.tag }}"
          cp dist/libraryx-debug.koplugin.zip "dist/libraryx-${tag}.koplugin.zip"
          sha256sum "dist/libraryx-${tag}.koplugin.zip" > "dist/libraryx-${tag}.koplugin.zip.sha256"

      - name: Verify ZIP
        shell: bash
        run: unzip -t "dist/libraryx-${{ steps.tag.outputs.tag }}.koplugin.zip"

      - name: Attach files to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}"             "dist/libraryx-${{ steps.tag.outputs.tag }}.koplugin.zip"             "dist/libraryx-${{ steps.tag.outputs.tag }}.koplugin.zip.sha256"             --clobber
